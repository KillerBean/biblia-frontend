plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def releaseSigningKeys = ['keyAlias', 'keyPassword', 'storeFile', 'storePassword']
def hasReleaseSigning = releaseSigningKeys.every { key ->
    keystoreProperties.getProperty(key) || System.getenv("ANDROID_${key.toUpperCase()}")
}
def allowDebugSigning = project.findProperty('allowDebugSigning') == 'true'
def releaseTaskRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains('release')
}
if (releaseTaskRequested && !hasReleaseSigning && !allowDebugSigning) {
    throw new GradleException(
        'Release signing is not configured. Provide android/key.properties or use -PallowDebugSigning=true only for local testing.'
    )
}

android {
    namespace = "dev.roseno.biblia"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "dev.roseno.biblia"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias'] ?: System.getenv('ANDROID_KEYALIAS')
            keyPassword = keystoreProperties['keyPassword'] ?: System.getenv('ANDROID_KEYPASSWORD')
            storeFile = file(keystoreProperties['storeFile'] ?: System.getenv('ANDROID_STOREFILE') ?: 'release.jks')
            storePassword = keystoreProperties['storePassword'] ?: System.getenv('ANDROID_STOREPASSWORD')
        }
    }

    buildTypes {
        release {
            // Debug signing is available only with an explicit local opt-in.
            signingConfig = hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
